services:
  daily-digest:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: daily-digest:latest
    container_name: daily-digest
    restart: "no"
    env_file:
      - path: ../.env
        required: false
      - path: .env
        required: false
    environment:
      - DIGEST_OUTPUT_DIR=/app/data/digests
      - DIGEST_DEFAULT_HOURS=${DIGEST_DEFAULT_HOURS:-24}
      - RSSHUB_BASE_URL=${RSSHUB_BASE_URL:-https://rsshub.app}
    deploy:
      resources:
        limits:
          memory: 512M
    mem_limit: 512m
    volumes:
      - digests_data:/app/data/digests
    networks:
      - digest_network
    healthcheck:
      disable: true
    command: ["--hours", "${DIGEST_DEFAULT_HOURS:-24}"]

  scheduler:
    image: mcuadros/ofelia:latest
    container_name: digest-scheduler
    restart: unless-stopped
    depends_on:
      - daily-digest
    env_file:
      - path: ../.env
        required: false
      - path: .env
        required: false
    command: daemon --docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - digest_network
    labels:
      ofelia.enabled: "true"
      ofelia.job-run.daily-digest.schedule: "${DIGEST_CRON_SCHEDULE:-0 0 7 * * *}"
      ofelia.job-run.daily-digest.image: "daily-digest:latest"
      ofelia.job-run.daily-digest.volume: "daily_digest_shared_volume:/app/data/digests"
      ofelia.job-run.daily-digest.network: "daily_digest_network"
      ofelia.job-run.daily-digest.command: "--hours ${DIGEST_DEFAULT_HOURS:-24}"
      ofelia.job-run.daily-digest.environment: '["DIGEST_OUTPUT_DIR=/app/data/digests", "RSSHUB_BASE_URL=${RSSHUB_BASE_URL:-https://rsshub.app}"]'
      ofelia.job-run.daily-digest.delete: "true"

volumes:
  digests_data:
    name: daily_digest_shared_volume

networks:
  digest_network:
    name: daily_digest_network
    driver: bridge
