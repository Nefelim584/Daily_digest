[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "daily-digest"
version = "0.1.0"
description = "AI and Tech Daily News Digest Collector"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.0",
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "mistralai>=3.2.0",
    "pydantic>=2.14.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.30.0",
]

[project.scripts]
daily-digest = "daily_digest.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
